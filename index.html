<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Test de Perfil DISC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      justify-content: space-between;
    }
    header {
      background-color: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid #334155;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .progress-bar-bg {
      width: 80px;
      height: 6px;
      background-color: #334155;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.3s ease;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h2 {
      font-size: 1.25rem;
      line-height: 1.4;
      margin-bottom: 16px;
      color: #ffffff;
    }
    p.desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .option-btn {
      width: 100%;
      text-align: left;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .option-btn.selected {
      border-color: #6366f1;
      background-color: rgba(99, 102, 241, 0.15);
      color: #fff;
    }
    .radio-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #64748b;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .option-btn.selected .radio-circle {
      border-color: #818cf8;
      background-color: #6366f1;
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .btn-subtle {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 8px;
    }
    .hidden {
      display: none !important;
    }
    .res-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .res-box {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .res-box h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }
    .res-box p {
      font-size: 0.9rem;
      color: #e2e8f0;
      font-weight: 500;
    }
    footer {
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
      color: #475569;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-badge">📊</div>
      <span>Test DISC</span>
    </div>
    <div id="progress-container" class="hidden" style="display: flex; align-items: center; gap: 8px;">
      <span id="progress-text" style="font-size: 0.75rem; color: #94a3b8;">1/10</span>
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- Inicio -->
    <div id="welcome-screen" class="card" style="text-align: center;">
      <h2 style="font-size: 1.5rem; margin-bottom: 10px;">Descubre tu Perfil DISC</h2>
      <p class="desc">Responde a 10 preguntas breves sobre tu forma de actuar en el trabajo o la universidad para descubrir tu estilo predominantemente conductual.</p>
      <button onclick="startQuiz()" class="btn-main">Comenzar el Test</button>
    </div>

    <!-- Preguntas -->
    <div id="quiz-screen" class="hidden">
      <div class="card">
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
      </div>
      <div class="nav-row">
        <button id="prev-btn" onclick="prevQuestion()" class="btn-subtle" style="visibility: hidden;">← Anterior</button>
        <span style="font-size: 0.75rem; color: #64748b;">Selecciona 1 opción</span>
      </div>
    </div>

    <!-- Resultados -->
    <div id="result-screen" class="hidden">
      <div id="result-card" class="card"></div>
      <button onclick="restartQuiz()" class="btn-subtle" style="width: 100%; margin-top: 16px; text-align: center;">Repetir Test</button>
    </div>
  </main>

  <footer>Evaluación de Perfil Conductual DISC</footer>

  <script>
    const quizData = [
      {
        q: "1. Te asignan un trabajo grupal importante en la universidad. ¿Cuál es tu primera reacción?",
        opts: [
          { text: "Asumo la iniciativa de inmediato, organizo el plan y asigno las tareas a cada uno.", type: "D" },
          { text: "Propongo hacer un grupo de WhatsApp, reunirnos a tomar un café y conocernos mejor.", type: "I" },
          { text: "Escucho lo que proponen los demás y me ofrezco a apoyar en lo que el grupo necesite.", type: "S" },
          { text: "Reviso detenidamente la rúbrica, el formato de entrega y los requisitos del profesor.", type: "C" }
        ]
      },
      {
        q: "2. El grupo tiene un desacuerdo o conflicto sobre la entrega del proyecto. ¿Qué haces?",
        opts: [
          { text: "Voy al grano, tomo la decisión final rápidamente y pido que sigamos adelante.", type: "D" },
          { text: "Uso el humor y el diálogo para calmar los ánimos y convencer a todos de ponernos de acuerdo.", type: "I" },
          { text: "Intento conciliar, busco que todos se sientan escuchados y evito que haya tensión.", type: "S" },
          { text: "Muestro con datos, guías y normas cuál es la opción técnicamente correcta para no perder puntos.", type: "C" }
        ]
      },
      {
        q: "3. En una exposición o presentación frente al salón, te caracteriza:",
        opts: [
          { text: "Hablar con seguridad, ir directo a las conclusiones y mostrar carácter firme.", type: "D" },
          { text: "Tener energía, gesticular, conectar con el público y hacer la charla entretenida.", type: "I" },
          { text: "Hablar de forma pausada, clara, tranquila y apoyar activamente cuando le toca a un compañero.", type: "S" },
          { text: "Tener una estructura perfecta, usar cifras precisas y responder basándome en fuentes confiables.", type: "C" }
        ]
      },
      {
        q: "4. Faltan solo 2 horas para la hora límite de entrega y el proyecto no está listo. ¿Cómo reaccionas?",
        opts: [
          { text: "Me activo con todo, tomo el control total del documento y lo termino bajo presión.", type: "D" },
          { text: "Motivo al grupo diciendo \"¡Tranquilos, sí alcanzamos!\", mientras redacto rápidamente.", type: "I" },
          { text: "Mantengo la calma, apoyo en silencio lo que me pidan y no entro en pánico.", type: "S" },
          { text: "Me estreso si las cosas se hacen con afán o sin calidad, pero reviso minuciosamente la versión final.", type: "C" }
        ]
      },
      {
        q: "5. ¿Qué cualidad valoras más cuando trabajas con un socio o compañero?",
        opts: [
          { text: "Que sea eficiente, rápido y orientado a resultados.", type: "D" },
          { text: "Que sea creativo, entusiasta y fácil de tratar.", type: "I" },
          { text: "Que sea leal, constante, paciente y buen compañero.", type: "S" },
          { text: "Que sea organizado, puntual, detallista y preciso.", type: "C" }
        ]
      },
      {
        q: "6. Estás negociando el precio de un producto o servicio en un caso de clase. Tu estrategia es:",
        opts: [
          { text: "Exigir lo que quiero firmemente y presionar para cerrar el trato a mi favor de inmediato.", type: "D" },
          { text: "Usar mi persuasión, encanto y empatía para convencer a la otra parte de colaborar.", type: "I" },
          { text: "Buscar un punto medio donde ambas partes ganen y se mantenga una buena relación a largo plazo.", type: "S" },
          { text: "Presentar tablas de costos, análisis de mercado y argumentos lógicos difíciles de refutar.", type: "C" }
        ]
      },
      {
        q: "7. ¿Cuál es tu mayor temor o lo que más te molesta en un equipo de trabajo?",
        opts: [
          { text: "La lentitud, la falta de acción y perder el tiempo en rodeos.", type: "D" },
          { text: "El rechazo, la rutina aburrida o que el ambiente sea muy frío e impersonal.", type: "I" },
          { text: "Los cambios bruscos e imprevistos y el conflicto o la agresión verbal.", type: "S" },
          { text: "La desorganización, la falta de rigor y los errores por hacer las cosas al azar.", type: "C" }
        ]
      },
      {
        q: "8. Cuando debes tomar una decisión personal o académica importante:",
        opts: [
          { text: "Confío en mi instinto y decido rápido para no perder oportunidades.", type: "D" },
          { text: "Consulto con mis amigos, busco opiniones y me dejo llevar por la intuición.", type: "I" },
          { text: "Lo consulto con calma, buscando mantener la estabilidad de mi entorno.", type: "S" },
          { text: "Analizo pros y contras, investigo datos y lo pienso el tiempo que sea necesario.", type: "C" }
        ]
      },
      {
        q: "9. En tu entorno o grupo de amigos, te reconocen por ser:",
        opts: [
          { text: "El líder que toma la iniciativa cuando nadie sabe qué hacer.", type: "D" },
          { text: "El alma del grupo, el que anima los planes y conecta a las personas.", type: "I" },
          { text: "El amigo fiel y comprensivo que siempre está dispuesto a escuchar y ayudar.", type: "S" },
          { text: "El perfeccionista y analítico al que todos le piden revisión o consejos técnicos.", type: "C" }
        ]
      },
      {
        q: "10. ¿Cómo es tu espacio o lugar habitual de estudio/trabajo?",
        opts: [
          { text: "Práctico y funcional: solo tengo lo necesario para cumplir con mis objetivos rápido.", type: "D" },
          { text: "Vistoso y lleno de vida: fotos, recuerdos, colores o notas inspiradoras.", type: "I" },
          { text: "Acogedor, limpio, cómodo y ordenado para trabajar tranquilo.", type: "S" },
          { text: "Impecablemente estructurado: todo clasificado, carpetas etiquetadas y herramientas a la mano.", type: "C" }
        ]
      }
    ];

    const profiles = {
      D: { title: "Perfil D – DOMINANCIA", color: "#f87171", bg: "rgba(239, 68, 68, 0.2)", power: "Determinación, liderazgo directo y rapidez en la toma de decisiones.", neg: "Vas al grano y te enfocas en ganar y obtener resultados.", reto: "Practicar la paciencia y escuchar más los detalles antes de decidir." },
      I: { title: "Perfil I – INFLUENCIA", color: "#fbbf24", bg: "rgba(245, 158, 11, 0.2)", power: "Sociabilidad, entusiasmo, persuasión y carisma.", neg: "Creas conexiones interpersonales y buscas acuerdos colaborativos.", reto: "Mantener el enfoque en los detalles técnicos y estructurar mejor los procesos." },
      S: { title: "Perfil S – ESTABILIDAD", color: "#34d399", bg: "rgba(16, 185, 129, 0.2)", power: "Empatía, paciencia, lealtad y capacidad para mantener la armonía.", neg: "Creas confianza, escuchas activamente y no presionas a los demás.", reto: "Volverte más asertivo al defender tu postura y perderle el miedo al cambio." },
      C: { title: "Perfil C – CUMPLIMIENTO", color: "#60a5fa", bg: "rgba(59, 130, 246, 0.2)", power: "Análisis riguroso, precisión, organización y búsqueda de la excelencia.", neg: "Te basas en hechos, datos, lógica e investigación profunda.", reto: "Evitar la \"parálisis por análisis\" y ser más flexible ante imprevistos." }
    };

    let cur = 0;
    let answers = Array(10).fill(null);

    function startQuiz() {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('progress-container').classList.remove('hidden');
      render();
    }

    function render() {
      const q = quizData[cur];
      document.getElementById('question-text').textContent = q.q;
      const c = document.getElementById('options-container');
      c.innerHTML = '';

      q.opts.forEach(opt => {
        const sel = answers[cur] === opt.type;
        const b = document.createElement('button');
        b.className = `option-btn ${sel ? 'selected' : ''}`;
        b.onclick = () => {
          answers[cur] = opt.type;
          if (cur < quizData.length - 1) { cur++; render(); } else { showRes(); }
        };
        b.innerHTML = `<div class="radio-circle"></div><span>${opt.text}</span>`;
        c.appendChild(b);
      });

      document.getElementById('progress-bar').style.width = `${((cur + 1) / 10) * 100}%`;
      document.getElementById('progress-text').textContent = `${cur + 1}/10`;
      document.getElementById('prev-btn').style.visibility = cur > 0 ? 'visible' : 'hidden';
    }

    function prevQuestion() {
      if (cur > 0) { cur--; render(); }
    }

    function showRes() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('progress-container').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const cnt = { D: 0, I: 0, S: 0, C: 0 };
      answers.forEach(a => { if (a) cnt[a]++; });

      let top = 'D', max = -1;
      for (const [k, v] of Object.entries(cnt)) {
        if (v > max) { max = v; top = k; }
      }

      const p = profiles[top];
      document.getElementById('result-card').innerHTML = `
        <div style="text-align: center; margin-bottom: 16px;">
          <span class="res-badge" style="background-color: ${p.bg}; color: ${p.color};">Perfil Predominante</span>
          <h2 style="color: ${p.color}; font-size: 1.4rem; margin-bottom: 4px;">${p.title}</h2>
          <p style="font-size: 0.8rem; color: #94a3b8;">${max} de 10 respuestas coincidentes</p>
        </div>
        <div class="res-box"><h4>⚡ Tu Superpoder</h4><p>${p.power}</p></div>
        <div class="res-box"><h4>🤝 En Negociación</h4><p>${p.neg}</p></div>
        <div class="res-box"><h4>🎯 Tu Reto</h4><p>${p.reto}</p></div>
      `;
    }

    function restartQuiz() {
      cur = 0;
      answers.fill(null);
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('welcome-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
